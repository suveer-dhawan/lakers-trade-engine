[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakers-trade-engine"
version = "0.1.0"
description = "NBA player valuation and trade analysis framework centered on the Los Angeles Lakers and Luka Dončić"
authors = [{ name = "Suveer Dhawan", email = "sd4054@nyu.edu" }]
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "black>=24.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
